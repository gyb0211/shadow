[package]
name = "shadow-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "影子 Web Gateway -- HTTP API 管理面板 + 前端嵌入"

[dependencies]
shadow-config.workspace = true
shadow-core.workspace = true
shadow-log.workspace = true

# Web 框架
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# 认证
jsonwebtoken = "9"
bcrypt = "0.17"

# 序列化
serde.workspace = true
serde_json.workspace = true

# 数据库
# SQLite: 复用 shadow-memory 的 rusqlite (避免 libsqlite3-sys links 冲突)
# MySQL: 用 mysql_async (纯 Rust, 不依赖 sqlx, 无 libsqlite3-sys 冲突)
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
mysql_async = { version = "0.35", default-features = false, features = [
    "minimal-rust",
    "chrono",
] }

# 异步
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true

# 前端静态文件嵌入
rust-embed = { version = "8", features = ["axum"] }
mime_guess = "2"

[dev-dependencies]
tempfile.workspace = true
