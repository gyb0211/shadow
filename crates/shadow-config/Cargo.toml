[package]
name = "shadow-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "影子配置层 -- TOML schema + 加载 + 密钥管理"

[dependencies]
shadow-core.workspace = true
shadow-log.workspace = true
anyhow.workspace = true
serde.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
toml = "0.8"
chacha20poly1305 = "0.10"
rand = "0.9"
hex = "0.4"
tempfile.workspace = true
directories = "6.0"
shellexpand = "3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1.10"
tracing.workspace = true
tokio = { version = "1.50", default-features = false, features = ["fs", "io-util", "sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
rustls-pki-types = "1.14.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "1.0.6"
tokio-socks = "0.5"