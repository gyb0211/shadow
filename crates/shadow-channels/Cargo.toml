[package]
name = "shadow-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "影子渠道 -- 消息平台集成 (CLI/Telegram/Discord...)"
publish = false

[dependencies]
# 依赖按需添加, 初始为空
shadow-core.workspace = true
shadow-config.workspace = true
shadow-log.workspace = true
shadow-providers.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
uuid = { version = "1.23.4", features = ["v4"] }
qrcode.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }

prost = { version = "0.14", default-features = false, features = [
    "derive",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

base64 = "0.22"
[dev-dependencies]
tempfile.workspace = true